# Include inside nginx's http{} context. Replace server_name and configure TLS at
# the reverse proxy. Mount the restored WordPress root read-only at /var/www/html.
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    server_tokens off;
    autoindex off;
    disable_symlinks on;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Dualscan-Runtime sealed always;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 403; }
    if ($arg_rest_route != "") { return 403; }
    if ($arg_graphql != "") { return 403; }
    if ($arg_wc_ajax != "") { return 403; }

    # Deny these independently of PHP, plugins and any saved wp-config flag.
    location ~* (^|/)(wp-admin|wp-json|graphql)(/|$) { return 403; }
    location ~* /(?:wp-login|xmlrpc|wp-cron|wp-signup|wp-activate|wp-mail|wp-trackback|wp-comments-post)\.php(?:/|$) { return 403; }
    location ~ /\. { return 403; }

    # The only public PHP entry point. Never derive SCRIPT_FILENAME from the URL.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }
    location ~* \.(php[0-9]*|phtml|phar|inc)(/|$) { return 403; }
    location ~* \.(dualscan|sql|sqlite|zip|tar|gz|bak|log|ini|env|json|ya?ml|conf)$ { return 403; }
    location ~* \.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp3|m4a|flac|ogg|wav|mp4|webm|vtt|pdf)$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location / { rewrite ^ /index.php last; }
}
